<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Document Q&amp;A</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1d2330;--muted:#6b7385;--border:#e2e5ec;--accent:#4f46e5;--accent-text:#fff;--ok:#16794c;--ok-bg:#e3f6ec;--warn:#9a5b00;--warn-bg:#fff2dc;--err:#b42318;--user:#eef0ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--panel:#181c25;--text:#e8eaf0;--muted:#98a0b3;--border:#2a303d;--accent:#7c83ff;--accent-text:#0f1218;--ok:#5fd39b;--ok-bg:#12301f;--warn:#f2b45a;--warn-bg:#352610;--err:#ff8a80;--user:#1f2340}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
header h1{font-size:17px;margin:0;font-weight:650}
header .sub{color:var(--muted);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);margin-left:auto}
.dot.up{background:var(--ok)} .dot.down{background:var(--err)}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:320px 1fr}
aside{border-right:1px solid var(--border);background:var(--panel);padding:16px;overflow-y:auto}
aside h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
aside h2:first-child{margin-top:0}
.drop{border:2px dashed var(--border);border-radius:12px;padding:18px 12px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent)}
.drop small{display:block;margin-top:4px}
.status{font-size:13px;margin-top:8px;min-height:18px;color:var(--muted)}
.status.err{color:var(--err)} .status.ok{color:var(--ok)}
.doc{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.doc .meta{flex:1;min-width:0}
.doc .name{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .info{font-size:12px;color:var(--muted)}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.icon-btn:hover{color:var(--err);background:var(--bg)}
.empty{color:var(--muted);font-size:13px}
main{display:flex;flex-direction:column;min-height:0}
.toolbar{display:flex;justify-content:flex-end;padding:8px 20px 0}
.link-btn{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer}
.link-btn:hover{color:var(--err)}
#chat{flex:1;overflow-y:auto;padding:12px 20px 20px;display:flex;flex-direction:column;gap:14px}
.hint{margin:auto;text-align:center;color:var(--muted);max-width:420px}
.hint h3{color:var(--text);margin:0 0 6px}
.msg{max-width:780px;padding:11px 14px;border-radius:14px;border:1px solid var(--border);background:var(--panel);white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--user);border-color:transparent}
.msg.bot{align-self:flex-start}
.msg.err{color:var(--err)}
.badges{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;white-space:normal}
.badge{padding:2px 8px;border-radius:999px;font-weight:600}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)}
.latency{color:var(--muted)}
details{margin-top:8px;white-space:normal;font-size:13px}
summary{cursor:pointer;color:var(--accent);font-weight:550}
.src{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)}
.src .top{display:flex;gap:8px;font-weight:600}
.src .top span:last-child{margin-left:auto;color:var(--muted);font-weight:500}
.src p{margin:4px 0 0;color:var(--muted);white-space:pre-wrap}
form{display:flex;gap:10px;padding:12px 20px 18px;border-top:1px solid var(--border);background:var(--panel)}
textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--text);max-height:140px}
textarea:focus{outline:2px solid var(--accent);border-color:transparent}
button.send{border:0;border-radius:12px;padding:0 20px;background:var(--accent);color:var(--accent-text);font-weight:650;cursor:pointer}
button.send:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:760px){.layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{border-right:0;border-bottom:1px solid var(--border);max-height:38vh}}
</style>
</head>
<body>
<header>
  <h1>RAG Document Q&amp;A</h1>
  <span class="sub">Answers grounded in your documents</span>
  <span class="dot" id="dot" title="API status"></span>
</header>

<div class="layout">
  <aside>
    <h2>Upload</h2>
    <div class="drop" id="drop">Click or drop files here<small>PDF, TXT or MD &middot; up to 20 MB</small></div>
    <input type="file" id="file" accept=".pdf,.txt,.md" multiple hidden>
    <div class="status" id="upStatus"></div>
    <h2>Documents</h2>
    <div id="docs"><div class="empty">Loading...</div></div>
  </aside>

  <main>
    <div class="toolbar"><button class="link-btn" id="clear" type="button">Clear history</button></div>
    <div id="chat"></div>
    <form id="form">
      <textarea id="q" rows="1" placeholder="Ask a question about your documents..." maxlength="2000"></textarea>
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const chat = $("#chat"), qBox = $("#q"), sendBtn = $("#send");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  let data = null;
  try { data = await r.json(); } catch (_) {}
  if (!r.ok) {
    const d = data && data.detail;
    throw new Error(typeof d === "string" ? d : Array.isArray(d) ? d.map((x) => x.msg).join("; ") : "Request failed (" + r.status + ")");
  }
  return data;
}

function fmtSize(b) {
  if (b == null) return "";
  return b < 1048576 ? Math.max(1, Math.round(b / 1024)) + " KB" : (b / 1048576).toFixed(1) + " MB";
}

/* ---------- documents ---------- */
async function loadDocs() {
  const box = $("#docs");
  try {
    const { documents } = await api("/documents");
    box.replaceChildren();
    if (!documents.length) { box.append(el("div", "empty", "No documents yet. Upload one to get started.")); return; }
    for (const d of documents) {
      const row = el("div", "doc"), meta = el("div", "meta");
      meta.append(el("div", "name", d.source));
      const bits = [d.chunks + " chunks", fmtSize(d.size_bytes), d.uploaded_at ? new Date(d.uploaded_at).toLocaleDateString() : ""];
      meta.append(el("div", "info", bits.filter(Boolean).join(" \u00b7 ")));
      const del = el("button", "icon-btn", "\u00d7");
      del.title = "Delete document"; del.type = "button";
      del.onclick = async () => {
        if (!confirm("Delete " + d.source + "?")) return;
        try { await api("/documents/" + encodeURIComponent(d.source), { method: "DELETE" }); loadDocs(); }
        catch (e) { setStatus(e.message, "err"); }
      };
      row.append(meta, del);
      box.append(row);
    }
  } catch (e) { box.replaceChildren(el("div", "empty", "Could not load documents: " + e.message)); }
}

function setStatus(msg, kind) {
  const s = $("#upStatus"); s.textContent = msg; s.className = "status" + (kind ? " " + kind : "");
}

async function uploadFiles(files) {
  for (const f of files) {
    setStatus("Indexing " + f.name + "... (the first upload can take a few minutes)");
    const fd = new FormData(); fd.append("file", f);
    try {
      const r = await api("/documents", { method: "POST", body: fd });
      setStatus("Indexed " + r.filename + " (" + r.chunks_indexed + " chunks)", "ok");
    } catch (e) { setStatus(f.name + ": " + e.message, "err"); }
    await loadDocs();
  }
}

const drop = $("#drop"), fileInput = $("#file");
drop.onclick = () => fileInput.click();
fileInput.onchange = () => { if (fileInput.files.length) uploadFiles([...fileInput.files]); fileInput.value = ""; };
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => { if (e.dataTransfer.files.length) uploadFiles([...e.dataTransfer.files]); });

/* ---------- chat ---------- */
function scrollDown() { chat.scrollTop = chat.scrollHeight; }
function removeHint() { const h = $("#hint"); if (h) h.remove(); }

function showHint() {
  const h = el("div", "hint"); h.id = "hint";
  h.append(el("h3", "", "Ask your documents anything"));
  h.append(el("div", "", "Upload a PDF, TXT or Markdown file on the left, then ask a question. Answers cite the passages they came from."));
  chat.append(h);
}

function botMessage(res) {
  const m = el("div", "msg bot");
  m.append(document.createTextNode(res.answer));
  const badges = el("div", "badges");
  badges.append(el("span", "badge " + (res.grounded ? "ok" : "warn"), res.grounded ? "Grounded in documents" : "Not found in documents"));
  if (res.latency_ms != null) badges.append(el("span", "latency", (res.latency_ms / 1000).toFixed(1) + " s"));
  m.append(badges);
  if (res.sources && res.sources.length) {
    const det = el("details"), sum = el("summary", "", res.sources.length + (res.sources.length === 1 ? " source" : " sources"));
    det.append(sum);
    res.sources.forEach((s, i) => {
      const box = el("div", "src"), top = el("div", "top");
      top.append(el("span", "", "[" + (i + 1) + "] " + s.source + (s.page ? ", p." + s.page : "")));
      top.append(el("span", "", "relevance " + Math.round(s.score * 100) + "%"));
      box.append(top, el("p", "", s.snippet));
      det.append(box);
    });
    m.append(det);
  }
  return m;
}

function addTurn(question, res) {
  removeHint();
  chat.append(el("div", "msg user", question), botMessage(res));
  scrollDown();
}

async function ask(question) {
  removeHint();
  chat.append(el("div", "msg user", question));
  const wait = el("div", "msg bot", "Thinking...");
  chat.append(wait); scrollDown();
  sendBtn.disabled = true;
  try {
    const res = await api("/query", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    wait.replaceWith(botMessage(res));
  } catch (e) {
    wait.className = "msg bot err"; wait.textContent = "Error: " + e.message;
  } finally { sendBtn.disabled = false; scrollDown(); qBox.focus(); }
}

$("#form").onsubmit = (e) => {
  e.preventDefault();
  const q = qBox.value.trim();
  if (q.length < 3) return;
  qBox.value = ""; qBox.style.height = "auto";
  ask(q);
};
qBox.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#form").requestSubmit(); } });
qBox.addEventListener("input", () => { qBox.style.height = "auto"; qBox.style.height = Math.min(qBox.scrollHeight, 140) + "px"; });

$("#clear").onclick = async () => {
  if (!confirm("Delete all saved question history?")) return;
  try { await api("/history", { method: "DELETE" }); chat.replaceChildren(); showHint(); }
  catch (e) { alert(e.message); }
};

/* ---------- startup ---------- */
async function init() {
  api("/health").then(() => $("#dot").classList.add("up")).catch(() => $("#dot").classList.add("down"));
  loadDocs();
  try {
    const { items } = await api("/history?limit=30");
    if (!items.length) { showHint(); return; }
    items.reverse().forEach((it) => addTurn(it.question, it));
  } catch (_) { showHint(); }
}
init();
</script>
</body>
</html>
